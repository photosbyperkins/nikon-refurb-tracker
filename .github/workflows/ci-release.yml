name: CI & Cross-Platform Release

on:
  push:
    branches: [ main, master ]
    tags: [ "v*" ]
  pull_request:
    branches: [ main, master ]

jobs:
  test:
    name: Test (${{ matrix.os }}, Python ${{ matrix.python-version }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest, ubuntu-latest]
        python-version: ["3.11", "3.12"]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Lint with Ruff
        run: ruff check src tests

      - name: Run Pytest suite
        run: pytest -v

  package:
    name: Build Standalone App (${{ matrix.os }})
    needs: test
    if: startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch'
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [windows-latest, macos-latest]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install package and PyInstaller
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Build Standalone Binary (Windows)
        if: matrix.os == 'windows-latest'
        run: |
          pyinstaller --noconfirm --onefile --windowed --name "NikonRefurbTracker-Windows" --add-data "src/nikon_tracker/web/static;nikon_tracker/web/static" src/nikon_tracker/tray.py

      - name: Build Standalone App (macOS)
        if: matrix.os == 'macos-latest'
        run: |
          pyinstaller --noconfirm --onefile --windowed --name "NikonRefurbTracker-macOS" --add-data "src/nikon_tracker/web/static:nikon_tracker/web/static" src/nikon_tracker/tray.py

      - name: Upload Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: NikonRefurbTracker-${{ matrix.os }}
          path: dist/*
